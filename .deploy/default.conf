map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 100m;
  location / {
    proxy_pass http://host.docker.internal:8300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location = /contentforge { return 301 /contentforge/; }
  location /contentforge/ {
    proxy_pass http://host.docker.internal:8123/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location = /datahub { return 301 /datahub/; }
  location /datahub/ {
    proxy_pass http://host.docker.internal:23080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location = /musicdl { return 301 /musicdl/; }
  location /musicdl/ {
    proxy_pass http://host.docker.internal:8099/musicdl/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /cs2hq { return 301 /cs2hq/; }
  location /cs2hq/ {
    proxy_pass http://host.docker.internal:5174/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off; proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
