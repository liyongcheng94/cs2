# CS2HQ 前端容器 nginx：SPA 回退 + /api 反代到 compose 服务 backend
server {
    listen 80;
    server_name _;

    # 上传体积上限（道具卡贴图 ≤5MB/张，≤9 张/卡）
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api → 后端容器（compose 网络内通过服务名解析）
    location /api/ {
        proxy_pass http://backend:8101;
        # Phase 5 530 加固：backend 容器重建窗口的瞬时失败自动重试下一 upstream
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        # SSE / 流式接口不缓冲
        proxy_buffering off;
        proxy_cache off;
    }

    # 路径前缀部署兼容（VITE_BASE=/cs2hq/）：容器内仍按根路径托管，
    # site-router 已做前缀剥离；这里让直连 5174 时 /cs2hq/* 也落到同一套文件。
    location /cs2hq/api/ {
        # 剥掉 /cs2hq 前缀再转后端（/cs2hq/api/x → backend /api/x）
        proxy_pass http://backend:8101/api/;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /cs2hq/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /cs2hq/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /cs2hq/index.html;
    }

    # 静态资源带指纹，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
